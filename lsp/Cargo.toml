[package]
name = "erabasic-lsp"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Language Server Protocol implementation for EraBasic (ERB/ERH files)"

[dependencies]
tower-lsp = "0.20"
tokio = { version = "1.35", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
notify = "6.0"
encoding_rs = "0.8"
anyhow = "1.0"
thiserror = "1.0"
indexmap = "2.0"
ropey = "1.5"
lsp-types = "0.94"
once_cell = "1.19"
fancy-regex = "0.19"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
fxhash = "0.2"

[dev-dependencies]
insta = "1.34"
criterion = "0.5"
tokio-test = "0.4"
tempfile = "3.0"

[features]
default = []

[[bin]]
name = "erabasic-lsp"
path = "src/main.rs"

[profile.release]
lto = "fat"
codegen-units = 1

[profile.fastbuild]
inherits = "release"
lto = false
codegen-units = 16
debug = "line-tables-only"

[lints.clippy]
manual_is_multiple_of = "allow"
chunks_exact_to_as_chunks = "allow"
type_complexity = "allow"
too_many_arguments = "allow"
needless_range_loop = "allow"